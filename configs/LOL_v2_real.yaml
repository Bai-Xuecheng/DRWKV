# Training configuration
GPU: [1]

VERBOSE: False

MODEL:
  MODE: 'LOL_v2_real'

# Optimization arguments.
OPTIM:
  # BATCH: 4 # 8
  # EPOCHS: 1000  #200
  # # EPOCH_DECAY: [10]
  # LR_INITIAL: 2e-4  # 1e-4
  # LR_MIN: 1e-6
  # BETA1: 0.9

LOSS:
  # MS2-Loss weights from the DRWKV paper.
  LAMBDA_RECON: 1.0
  LAMBDA_SPARSE: 0.01
  LAMBDA_SMOOTH: 0.1
  LAMBDA_ARTIFACT: 0.05
  LAMBDA_REG: 0.0001
  EDGE_AWARE_WEIGHT: 10.0
  ARTIFACT_TV_WEIGHT: 0.1

TRAINING:
  VAL_AFTER_EVERY: 1
  RESUME: False   # False
  PATCH_SIZES: [256]
  BATCH_SIZES: [2]
  EPOCHS_PER_SIZE: [256]
  TRAIN_DIR: '/home/WACV/LOLv2/Real_captured/Train'       # path to training data
  VAL_DIR: '/home/WACV/LOLv2/Real_captured/Test' # path to validation data
  SAVE_DIR: '/home/WACV/checkpoints/LOL_v2_real/'           # path to save models and images
